<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>曜點數位行銷｜聯絡我們</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html"><span class="logo-mark">Y</span> 曜點<span>行銷</span></a>
    <nav><a href="index.html">首頁</a><a href="about.html">關於我們</a><a class="active" href="contact.html">聯絡我們</a></nav>
  </header>
  <main>
    <section class="page-hero contact-hero">
      <p class="eyebrow">GET IN TOUCH</p>
      <h1>有想法嗎？<br><span>一起讓它發生。</span></h1>
      <p>告訴我們你的需求，我們會透過 Email 與你聯繫。</p>
    </section>
    <section class="contact-wrap">
      <aside class="contact-info">
        <p class="eyebrow">SAY HELLO</p><h2>每個好合作，<br>都從一次對話開始。</h2>
        <p>歡迎分享你的品牌、行銷目標或目前遇到的挑戰。</p>
        <div class="info-line"><span>✉</span><div><small>EMAIL</small><strong>請透過右側表單留言</strong></div></div>
        <div class="info-line"><span>⌖</span><div><small>STUDIO</small><strong>台灣・線上服務</strong></div></div>
      </aside>
      <form class="contact-form" action="請替換成你的_Google_Apps_Script_網頁應用程式網址" method="post" target="_blank">
        <label for="name">姓名 <em>*</em></label>
        <input id="name" name="name" type="text" placeholder="請輸入你的姓名" required maxlength="80">
        <label for="email">Email <em>*</em></label>
        <input id="email" name="email" type="email" placeholder="name@example.com" required maxlength="120">
        <label for="message">聯絡事項 <em>*</em></label>
        <textarea id="message" name="message" rows="5" placeholder="請簡單描述你的需求或想法..." required maxlength="3000"></textarea>
        <!-- 隱藏欄位：簡易防垃圾訊息，正常使用者不需填寫 -->
        <div class="hp-field" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
        <button class="button submit-button" type="submit">送出訊息 <span>→</span></button>
        <p class="form-note">按下送出後，系統會開啟 Google 回覆頁面。請勿在表單填寫密碼或敏感個人資料。</p>
      </form>
    </section>
  </main>
  <footer><a class="logo footer-logo" href="index.html"><span class="logo-mark">Y</span> 曜點<span>行銷</span></a><p>© 2026 曜點數位行銷｜課堂展示網站</p></footer>
</body>
</html>
